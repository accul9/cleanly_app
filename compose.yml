services:
  backend:
    build:
      context: ./backend_project
      dockerfile: Dockerfile
    container_name: "cleanly_backend_default"
    tty: true
    ports:
      - 8000:8000
    volumes:
      - ./backend_project/backend:/backend
  frontend:
    build:
      context: ./frontend_project
      dockerfile: Dockerfile
    container_name: "cleanly_frontend_default"
    tty: true
    ports:
      - 3000:3000
    volumes:
      - ./frontend_project/frontend:/usr/src/app
    environment:
      - NODE_ENV=development